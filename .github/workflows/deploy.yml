name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Textures are intentionally gitignored (CC BY 4.0 assets are not
      # redistributed in this repo), so the deployed demo must fetch them at
      # build time. `continue-on-error` keeps a flaky upstream from blocking a
      # release - the app falls back to procedural textures if this step fails.
      - name: Fetch planet textures
        run: npm run textures
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /solar-system-3d/

      - name: Copy index.html to 404.html for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
